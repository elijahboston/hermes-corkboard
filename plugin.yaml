name: corkboard
version: "0.1.0"
manifest_version: 2
requires_hermes: ">=0.21.6"
description: One place where agents pin "only the owner can do this" items, and where items clear themselves when a check passes.
author: Elijah Boston
license: MIT
provides_tools:
  - corkboard
provides_hooks:
  - kanban_task_blocked
  - kanban_task_completed
  - on_kanban_dispatch_tick
config_schema:
  retention_days:
    type: int
    default: 30
    description: How many days closed (done/dismissed) pins stay on the board; 0 keeps them forever.
